name: tests
# 本仓库默认分支为 feature/video-segment-labeler-zh,不限分支,推送即测

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Qt 离屏渲染:CI 无显示服务器也可跑 UI 相关测试
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 语法检查
        run: python -m compileall video_labeler
      - name: 运行测试(单用例 120s 超时,防模态框/事件循环挂起拖死整个 job)
        run: pytest -q --timeout=120 --timeout-method=thread
