name: tests
# 本仓库默认分支为 feature/video-segment-labeler-zh,不限分支,推送即测

on:
  push:
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Qt 离屏渲染:CI 无显示服务器也可跑 UI 相关测试
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: 安装 Qt 系统依赖(Ubuntu offscreen 渲染)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
          sudo apt-get install -y libpulse0 libasound2 timgm6mb-soundfont
      - name: 语法检查
        run: python -m compileall video_labeler
      - name: 运行测试(单用例 120s 超时,防模态框/事件循环挂起拖死整个 job)
        # python -m 而非裸 pytest:把仓库根目录加入 sys.path,包才能被导入
        run: python -m pytest -q --timeout=120 --timeout-method=thread
